name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: debug-asan-ubsan
            build_type: Debug
            cxx_flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          - name: release
            build_type: Release
            cxx_flags: ""
    name: linux-tests (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DJACKAL_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Repo is clean after the tests
        run: git status --porcelain && test -z "$(git status --porcelain)"

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (no ASIO SDK)
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Repo is clean after the tests
        shell: bash
        run: git status --porcelain && test -z "$(git status --porcelain)"
